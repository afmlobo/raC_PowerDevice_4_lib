<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Events Log Dashboard</title>
    <link rel="stylesheet" href="../ISA_style.css">
    <style>
        * { box-sizing: border-box; }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--equipment-border);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--title-fg);
            margin: 0 0 10px 0;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            color: #475CA7;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .chart-container {
            background: var(--grouping-box);
            border-radius: 8px;
            border: 1px solid var(--equipment-border);
            padding: 20px;
        }

        .bar-chart {
            height: 400px;
            width: 100%;
        }

        .data-table-container {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        .data-table th, .data-table td {
            padding: 8px;
            border: 1px solid var(--equipment-border);
            text-align: left;
            color: var(--label-fg);
        }

        .data-table th {
            background: var(--grouping-box);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table tbody tr:hover {
            background: var(--card-bg-hover);
        }

        #loading {
            text-align: center;
            font-size: 16px;
            color: var(--label-fg);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body data-device-name="{{deviceName}}">
    <div class="dashboard-stats" id="eventStats">
        <!-- Dynamic Event Tiles will be inserted here -->
    </div>

    <div class="dashboard-grid">
        <div class="chart-container">
            <div id="barChart" class="bar-chart"></div>
        </div>
        <div class="chart-container">
            <div class="data-table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Record ID</th>
                            <th>Timestamp</th>
                            <th>Event Type</th>
                            <th>General Code</th>
                            <th>Information Code</th>
                        </tr>
                    </thead>
                    <tbody id="eventTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="loading">Loading...</div>
    <script src="../echarts.min.js"></script>
    <script src="js_FetchEventLog.js"></script>
</body>
</html>
