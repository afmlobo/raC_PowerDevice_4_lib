    - Name: Pair3
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 2
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "Verify that 3-phase voltage is present at the line side connections."
    - Name: Pair4
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 3
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check control voltage, wiring, and polarity (A1/A2/A3 terminal)."
    - Name: Pair5
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 4
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "Correct, isolate, or remove wiring error before restarting."
    - Name: Pair6
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 5
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "Check the power system and correct if necessary."
    - Name: Pair7
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 6
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. If the fault was initiated by a transient, power cycling may clear the problem. \n2. This fault may be reset by a [SetToDefaults] (P68).\n3. Replacement of the ArmorStart may be required. "
    - Name: Pair8
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 8
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check for the source of the jam (excessive load or mechanical transmission component failure).\n2. Check [JamInhibitTime], [JamTripDelay], and [JamTripLevel] setting (P70-72)."
    - Name: Pair9
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 9
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check for the source of stall (excessive load, or mechanical transmission component failure).\n2. Check [StallEnabledTime] and [StallTripLevel] (P74-75).\n3. Check if [FLASetting] is set correctly (P28)."
    - Name: Pair11
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 10
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check motor and mechanical system for broken shaft, belts, or gear box.\n2. Check [ULInhibitTime], [ULTripDelay], [ULTripLevel] and [ULWarningLevel] (P76-79)."
    - Name: Pair12
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 13
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "Correct, isolate or remove wiring error prior to restarting the system."
    - Name: Pair10
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 14
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "Fault generated based on user configuration. This fault may be reset after the condition that caused it is removed. For example, the Auxiliary Input goes low or the DeviceLogix logic drives the bit low."
    - Name: Pair13
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 15
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Cycle power. \n2. Replace drive if fault cannot be cleared."
  - Name: Mode
    Type: PropertyType
    DataType: DynamicLinkMode
    ReferenceType: HasComponent
    ModellingRule: Optional
