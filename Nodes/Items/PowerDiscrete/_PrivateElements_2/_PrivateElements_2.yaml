- Name: raC_4_00_raC_Dvc_AS290E_InfLookup_Details
  Id: g=0c364b6a3e910ca2c100624379694ce6
  Supertype: ValueMapConverter
  Description: {"LocaleId":"en-US","Text":"Information loop-up table for fault table containing long details/actions for fault codes"}
  ReferenceType: HasComponent
  Children:
  - Name: ns=2;Pairs
    Type: BaseObjectType
    ModellingRule: None
    Children:
    - Name: Pair1
      Type: ValueMapPair
