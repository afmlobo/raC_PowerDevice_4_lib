<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Monitor Trend Viewer</title>
    <link rel="stylesheet" href="../ISA_style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--display-bg, #E0E0E0);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            gap: 0;
        }

        #message-container {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 6px;
            min-height: 44px;
        }

        .message {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
        }

        .message-error {
            background-color: var(--urgent-alarm, #E22028);
            border: 1px solid #b71c1c;
            color: #ffffff;
        }

        .message-info {
            background-color: var(--grouping-box, #E8E8E8);
            border: 1px solid var(--separator-line, #D8D8D8);
            color: var(--label-fg, #3F3F3F);
        }

        .message-success {
            background-color: var(--state-good, #475CA7);
            border: 1px solid #1b5e20;
            color: #ffffff;
        }

        .message-warning {
            background-color: var(--medium-alarm, #F5E11B);
            border: 1px solid #e65100;
            color: var(--label-fg, #3F3F3F);
        }

        .message-text {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }

        .message-close {
            background: none;
            border: none;
            color: inherit;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            min-width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .message-close:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        #chart-container {
            flex: 1;
            background-color: #E0E0E0;
            border-radius: 0;
            border: none;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #main-chart {
            width: 100%;
            flex: 1;
            min-height: 300px;
        }

        /* Legend Container */
        #legend-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 8px 16px;
            margin-top: 0;
            background: #E0E0E0;
            max-height: 70px;
            overflow-y: auto;
            border-top: 1px solid #D0D0D0;
            align-content: flex-start;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s ease;
            user-select: none;
            white-space: nowrap;
        }

        .legend-item:hover {
            background-color: rgba(71, 92, 167, 0.1);
        }

        .legend-item.disabled {
            opacity: 0.5;
        }

        .legend-marker {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            flex-shrink: 0;
            transition: opacity 0.2s ease;
        }

        .legend-placeholder {
            color: var(--eng-unit-fg, #919191);
            font-size: 12px;
            font-style: italic;
            width: 100%;
            text-align: center;
        }

        /* No Data Message */
        .no-data-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            color: var(--label-fg, #3F3F3F);
            height: 100%;
        }

        .no-data-message .info-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 16px;
            opacity: 0.7;
        }

        .no-data-message h3 {
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: 600;
        }

        .no-data-message p {
            font-size: 14px;
            opacity: 0.8;
            max-width: 400px;
        }

        /* Error Message */
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #c62828;
            margin: 20px;
            font-size: 14px;
        }

        /* Loading Overlay */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-overlay h3 {
            color: var(--label-fg, #3F3F3F);
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="message-container"></div>
        <div id="chart-container">
            <div id="main-chart"></div>
            <div id="legend-container">
                <div class="legend-placeholder">Legend will appear here</div>
            </div>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <h3>Loading trend data...</h3>
    </div>

    <script src="../echarts.min.js"></script>
    <script src="js_FetchTrend.js"></script>
</body>
</html>
