<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonics Dashboard - {{deviceName}}</title>
    <link rel="stylesheet" href="../ISA_style.css">
    <style>
        * { box-sizing: border-box; }

        .dashboard-container {
            max-width: 1280px;
            margin: 0 auto;
        }

        .card:hover { box-shadow: none; }

        .card-header {
            padding: 0;
        }

        .card-header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-top: 12px;
            padding-right: 12px;
            padding-bottom: 12px;
            padding-left: 0px;
        }

        .status {
            font-size: 0.75rem;
            color: var(--label-fg);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }

        .status-dot.good { background: var(--state-good); }
        .status-dot.warn { background: var(--medium-alarm); animation: none; }
        .status-dot.error { background: var(--urgent-alarm); animation: none; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card-content {
            padding: 24px;
            display: flex;
            flex-direction: row;
            gap: 24px;
            height: 550px;
        }

        .left-panel {
            flex: 0 0 30%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stats-panel {
            background: var(--grouping-box);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid var(--equipment-border);
            flex: 1;
            overflow-y: auto;
        }

        .stats-title {
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-title span {
            color: var(--title-fg);
            font-size: 1rem;
        }

        .harmonic-values {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 16px;
            font-size: 0.875rem;
            color: var(--label-fg);
        }

        .harmonic-values div {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-radius: 4px;
            background: var(--card-bg);
            border: 1px solid var(--equipment-border);
        }

        .harmonic-values .label {
            font-weight: 500;
            color: var(--title-fg);
        }

        .harmonic-values .value {
            color: var(--data-fg);
            font-weight: 500;
        }

        .right-panel {
            flex: 0 0 70%;
            display: flex;
            flex-direction: column;
            background: var(--grouping-box);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid var(--equipment-border);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chart-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--title-fg);
        }

        .chart-controls {
            display: flex;
            gap: 8px;
        }

        .chart-controls button {
            background: var(--card-bg);
            border: 1px solid var(--equipment-border);
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.875rem;
            cursor: pointer;
            color: var(--label-fg);
        }

        .chart-controls button:hover {
            background: var(--data-fg);
            color: white;
            border-color: var(--data-fg);
        }

        #harmonics-chart {
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid var(--equipment-border);
        }

        @media (max-width: 768px) {
            .card-content {
                flex-direction: column;
                height: auto;
            }
            .left-panel, .right-panel {
                flex: 0 0 100%;
            }
            .right-panel {
                height: 400px;
            }
        }
    </style>
</head>
<body data-device-name="{{deviceName}}">
    <div class="dashboard-container">
        <div class="card">
            <div class="card-header">
                <div class="card-header-left">
                    <div class="card-subtitle">Real-time Power Quality Monitoring</div>
                </div>
                <div class="status">
                    <span id="status-dot" class="status-dot good"></span>
                    <span id="last-updated">Last updated: --</span>
                </div>
            </div>
            <div class="card-content">
                <div class="left-panel">
                    <div class="stats-panel">
                        <div class="stats-title">
                            <span>Harmonic Values</span>
                        </div>
                        <div class="harmonic-values" id="harmonic-values">
                        </div>
                    </div>
                </div>
                <div class="right-panel">
                    <div class="chart-header">
                        <div class="chart-title" id="chart-title">Harmonics Chart</div>
                        <div class="chart-controls">
                            <button id="toggle-view">Switch to Line</button>
                            <button id="toggle-first-harmonic">Hide Fundamental</button>
                        </div>
                    </div>
                    <div id="harmonics-chart"></div>
                </div>
            </div>
        </div>
        <script src="../echarts.min.js"></script>
        <script src="js_FetchHarmonicsData.js"></script>
    </div>
</body>
</html>
