<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Monitoring Dashboard - Single Device</title>
    <link rel="stylesheet" href="../ISA_style.css">
    <script type="text/javascript" src="../echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--display-bg);
            min-height: 100vh;
            padding: 0;
        }
        
        .dashboard-container {
            width: 100%;
            max-width: none;
            margin: 0;
            background: var(--display-bg);
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
        }
        
        .dashboard-header {
            display: none;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            opacity: 0.9;
        }

        .breadcrumb-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-title {
            font-size: 28px;
            font-weight: 700;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .last-update {
            text-align: right;
            opacity: 0.9;
        }

        .last-update-time {
            font-size: 14px;
            margin-top: 4px;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 24px 32px;
            border-bottom: 3px solid #667eea;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            color: white;
        }
        
        .header-left {
            flex: 1;
        }

        .header h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 12px;
            color: white;
        }

        .breadcrumb-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .location-title {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }
        
        .time-info {
            text-align: right;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }
        
        .time-info > div {
            margin: 3px 0;
        }
        
        .aggregation-badge {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
            margin-top: 5px;
            display: inline-block;
            font-size: 13px;
        }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
        }
        
        .kpi-card {
            background: var(--grouping-box);
            padding: 20px;
            border-radius: 0;
            box-shadow: none;
            transition: none;
        }
        
        .kpi-card:hover {
            transform: none;
            box-shadow: none;
        }
        
        .kpi-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }
        
        .kpi-unit {
            font-size: 14px;
            color: #999;
            margin-left: 5px;
        }
        
        .kpi-trend {
            font-size: 12px;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .trend-up {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .trend-down {
            background: #ffebee;
            color: #c62828;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
            padding: 20px;
        }
        
        .chart-card {
            background: var(--grouping-box);
            border-radius: 0;
            padding: 20px;
            box-shadow: none;
        }
        
        .chart-card.full-width {
            grid-column: 1 / -1;
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .chart-container {
            width: 100%;
            height: 350px;
        }
        
        .chart-container.large {
            height: 450px;
        }
        
        @media (max-width: 1024px) {
            .kpi-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            text-align: center;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-title">Total Energy Consumed</div>
                <div class="kpi-value" id="kpiTotalEnergy">--<span class="kpi-unit">kWh</span></div>
                <div class="kpi-trend trend-up" id="kpiEnergyTrend">-- %</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Peak Demand</div>
                <div class="kpi-value" id="kpiPeakDemand">--<span class="kpi-unit">kW</span></div>
                <div class="kpi-trend trend-down" id="kpiDemandTrend">-- %</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Average Power Factor</div>
                <div class="kpi-value" id="kpiAvgPF">--<span class="kpi-unit"></span></div>
                <div class="kpi-trend trend-up" id="kpiPFTrend">--</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Reactive Energy</div>
                <div class="kpi-value" id="kpiReactiveEnergy">--<span class="kpi-unit">kVARh</span></div>
                <div class="kpi-trend trend-down" id="kpiReactiveTrend">-- %</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Total Apparent Energy</div>
                <div class="kpi-value" id="kpiApparentEnergy">--<span class="kpi-unit">kVAh</span></div>
                <div class="kpi-trend trend-up" id="kpiApparentTrend">-- %</div>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-card full-width">
                <div class="chart-title">📊 Energy Consumption Trend</div>
                <div class="chart-container large" id="energyTrendChart"></div>
            </div>
            
            <div class="chart-card full-width">
                <div class="chart-title">📈 Demand Profile</div>
                <div class="chart-container" id="demandChart"></div>
            </div>
            
            <div class="chart-card">
                <div class="chart-title">🔄 Active vs Reactive Energy</div>
                <div class="chart-container" id="activeReactiveChart"></div>
            </div>
            
            <div class="chart-card">
                <div class="chart-title">💡 Power Factor Analysis</div>
                <div class="chart-container" id="powerFactorChart"></div>
            </div>
            
            <div class="chart-card full-width">
                <div class="chart-title">🔢 Device Status Distribution</div>
                <div class="chart-container" id="statusChart"></div>
            </div>
        </div>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <h3>Loading energy data...</h3>
    </div>

    <script type="text/javascript" src="../all.min.js"></script>
    <script src="js_FetchEnergyLogData.js"></script>
</body>
</html>
