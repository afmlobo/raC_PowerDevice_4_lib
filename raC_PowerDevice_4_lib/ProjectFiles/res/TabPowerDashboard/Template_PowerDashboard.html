<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Monitoring Dashboard</title>
    <link rel="stylesheet" href="../ISA_style.css">
    <script type="text/javascript" src="../all.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Filter Styles */
        .filter-container {
            background: var(--grouping-box);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--equipment-border);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-container label {
            font-weight: 500;
            color: var(--label-fg);
        }

        .filter-container select,
        .filter-container input[type="date"] {
            min-width: 120px;
            height: 38px;
            border: 1px solid var(--equipment-border);
            border-radius: 4px;
            padding: 0 10px;
            background: var(--card-bg);
            color: var(--label-fg);
            cursor: pointer;
        }

        .filter-container select:hover,
        .filter-container input[type="date"]:hover {
            border-color: var(--data-fg);
        }

        .filter-container button {
            background: var(--data-fg);
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            height: 38px;
            font-weight: 500;
        }

        #customDateRange {
            display: none;
            gap: 10px;
        }

        /* Current File Display */
        #currentFile {
            font-size: 16px;
            color: var(--label-fg);
            margin: 0;
            padding: 0 10px;
            white-space: nowrap;
        }

        /* Chart Styles */
        #charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
            margin-bottom: 0;
        }

        .chart-container {
            background: var(--grouping-box);
            border-radius: 8px;
            border: 1px solid var(--equipment-border);
            padding: 20px;
        }

        .chart-container div {
            width: 100%;
            height: 400px;
        }

        #loading {
            text-align: center;
            font-size: 16px;
            color: #3F3F3F;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
    </style>
</head>

<body style="height: 100%; margin: 0" data-device-name="{{deviceName}}">
  <div class="dashboard-container" style="height:100%;">

    <!-- Currently Loaded at TOP -->
    <div id="currentFile" style="padding: 8px 12px; font-weight: 600;"></div>

    <!-- Charts Grid : 2 columns (side-by-side) -->
    <div id="charts-grid"
         style="
           display: grid;
           grid-template-columns: 1fr 1fr;
           gap: 16px;
           width: 100%;
           box-sizing: border-box;
           padding: 8px 12px;
         ">

      <div class="chart-container" style="min-height: 320px;">
        <div id="chart1" style="width: 100%; height: 320px;"></div>
      </div>

      <div class="chart-container" style="min-height: 320px;">
        <div id="chart2" style="width: 100%; height: 320px;"></div>
      </div>

      <div class="chart-container" style="min-height: 320px;">
        <div id="chart3" style="width: 100%; height: 320px;"></div>
      </div>

      <div class="chart-container" style="min-height: 320px;">
        <div id="chart4" style="width: 100%; height: 320px;"></div>
      </div>

    </div>

        <div id="loading">Loading...</div>
    </div>
    <script type="text/javascript" src="../echarts.min.js"></script>
    <script type="text/javascript" src="js_FetchPowerDashboardData.js"></script>
</body>
</html>
