<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Quality Dashboard - {{deviceName}}</title>
    <style>
      :root {
        --primary-blue: #475CA7;
        --secondary-blue: #475CA7;
        --warning-orange: #ff6600;
        --background-gray: #E0E0E0;
        --white: #E8E8E8;
        --eng-unit-fg: #919191;
        --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0px;
        background-color: var(--background-gray);
      }

      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: var(--primary-blue);
        text-align: center;
        background: var(--white);
        padding: 20px;
        border-radius: 8px;
        box-shadow: var(--shadow);
        z-index: 1000;
      }

      .summary-table {
        width: 100%;
        background: var(--white);
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: var(--shadow);
        border-collapse: collapse;
        display: none;
      }

      .summary-table th,
      .summary-table td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }

      .summary-table th {
        background-color: var(--primary-blue);
        color: var(--white);
      }

      .summary-table tbody tr:hover {
        background-color: #f8f9fa;
      }

      .trend-chart {
        width: 150px;
        height: 40px;
        display: inline-block;
      }

      .view-btn {
        padding: 6px 12px;
        background-color: var(--secondary-blue);
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .view-btn:hover {
        background-color: var(--primary-blue);
      }

      .waveform-icon {
        color: var(--warning-orange);
        margin-left: 5px;
      }

      .dashboard {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-top: 20px;
        display: none;
      }

      .chart-container {
        background: var(--white);
        border-radius: 8px;
        padding: 20px;
        box-shadow: var(--shadow);
      }

      .table-container {
        grid-column: 1 / -1;
        background: var(--white);
        border-radius: 8px;
        padding: 20px;
        box-shadow: var(--shadow);
        margin-top: 20px;
      }

      #eventTable {
        width: 100%;
        border-collapse: collapse;
      }

      #eventTable th,
      #eventTable td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }

      #eventTable th {
        background-color: var(--primary-blue);
        color: var(--white);
      }

      #eventTable tbody tr:hover {
        background-color: #f8f9fa;
      }

      .waveform-message {
        color: #666;
        font-size: 12px;
      }

      #last-updated {
        display: block;
        text-align: right;
        font-size: 14px;
        color: var(--eng-unit-fg);
        margin-top: 10px;
        margin-right: 20px; /* Aligns with table-container's padding */
        width: 100%; /* Ensures it spans the container for proper right alignment */
      }
    </style>
  </head>
  <body data-device-name="{{deviceName}}">
    <div id="loading">Loading...</div>
    <table class="summary-table" id="summaryTable">
      <thead>
        <tr>
          <th>Event Type Category</th>
          <th>Total Occurrences</th>
          <th>Latest Occurrence</th>
          <th>Trend</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="dashboard">
      <div class="chart-container">
        <div id="eventFrequencyChart" style="width: 100%; height: 350px;"></div>
      </div>
      <div class="chart-container">
        <div id="eventDurationChart" style="width: 100%; height: 350px;"></div>
      </div>
      <div class="chart-container">
        <div id="voltageLevelsChart" style="width: 100%; height: 350px;"></div>
      </div>
      <div class="chart-container">
        <div id="eventTypesChart" style="width: 100%; height: 350px;"></div>
      </div>
      <div class="table-container">
        <table id="eventTable">
          <thead>
            <tr>
              <th>Record ID</th>
              <th>Event Type</th>
              <th>Sub Event</th>
              <th>Timestamp</th>
              <th>Duration (ms)</th>
              <th>Trip Point</th>
              <th>Min/Max</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <span id="last-updated"></span>
      </div>
    </div>
    <script src="../echarts.min.js"></script>
    <script src="../all.min.js"></script>
    <script src="js_FetchPowerQualityData.js"></script>
  </body>
</html>
