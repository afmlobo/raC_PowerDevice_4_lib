  Description: {"LocaleId":"","Text":"Name: E10X-XX Series Contactor - Predictive Maintainance -  Contactor_PM\n\nVersion: 4.01\n\nDescription:\n\nThe Contactor Predictive Maintenance object is designed to perform cycle counting and deliver predictive maintenance indications for contactors, depending on the selected hardware type. It enables configuration tailored to the specific contactor hardware, tracks the number of contactor cycles, signals when the maximum cycle count has been exceeded, and identifies faults such as mismatches between command and status."}
