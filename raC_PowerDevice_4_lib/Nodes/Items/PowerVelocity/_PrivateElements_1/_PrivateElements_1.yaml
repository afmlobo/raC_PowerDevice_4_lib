- Name: raC_4_00_raC_Dvc_AS294E_InfLookup_Details
  Id: g=2c291b76ddb66321b6171d13c8cc2b2d
  Supertype: ValueMapConverter
  Description: {"LocaleId":"en-US","Text":"Information loop-up table for fault table containing long details/actions for fault codes"}
  ReferenceType: HasComponent
  Children:
  - Name: ns=2;Pairs
    Type: BaseObjectType
    ModellingRule: None
    Children:
    - Name: Pair1
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 4294934528
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "No description found in the lookup table for the current code."
    - Name: Pair5
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 1
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "Verify load is operating correctly and the ArmorStart is properly set-up. The fault may be reset only after the motor has sufficiently cooled."
    - Name: Pair6
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 2
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check the wiring between the drive and motor.\n2. Check motor for grounded phase.\n3. Replace ArmorStart if fault cannot be cleared."
    - Name: Pair7
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 3
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check control voltage, wiring, and polarity (A1/A2/A3 terminal)."
    - Name: Pair8
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 4
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "Correct, isolate, or remove wiring error before restarting."
    - Name: Pair9
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 5
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check for excess load, improper [BoostSelect] setting (P86) or other causes of excess current.\n2. Check load requirements and [SWCurrentTrip] setting (P83)."
    - Name: Pair10
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 6
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. If the fault was initiated by a transient, power cycling may clear the problem. \n2. This fault may be reset by a [SetToDefaults] (P68).\n3. Replacement of the ArmorStart may be required. "
    - Name: Pair11
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 7
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. If powered off, power on and reset the fault\n2. Cycle power to the drive. "
    - Name: Pair12
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 8
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Verify disconnect is not open and check input fuses.\n2. Check AC line for low/high voltage or line power interruption.\n3. Bus OverVoltage can also be caused by motor regeneration. Extending the [DecelTime1] or [DecelTime2] (P37,70) may reduce regeneration."
    - Name: Pair13
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 9
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check for excessive load or mechanical transmission component failure. \n2. Increase [AccelTime1] or [AccelTime2] (P36, 69) or reduce load so drive output current does not exceed the current set by [CurrentLimit] (P31)."
    - Name: Pair14
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 10
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check for blocked or dirty heat sink fins.\n2. Verify ambient temp has not exceeded 40 °C.\n3. Clear the fault or cycle power."
    - Name: Pair15
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 11
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check the wiring between the drive and motor.\n2. Check motor for grounded phase.\n3. Replace starter module if fault cannot be cleared."
    - Name: Pair16
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 12
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Correct the cause of the fault and manually clear. \n2. Check [AutoRestartTries] and [AutoRestartDelay] (P84,85) meets application needs."
    - Name: Pair17
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 13
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Cycle power. \n2. Replace unit if failure can not be cleared."
    - Name: Pair18
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 14
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "Correct, isolate or remove wiring error prior to restarting the system."
    - Name: Pair19
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 15
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "Fault generated based on user configuration. This fault may be reset after the condition that caused it is removed. For example, the Auxiliary Input goes low or the DeviceLogix logic drives the bit low."
    - Name: Pair20
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 16
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Cycle power. \n2. Replace drive if fault cannot be cleared."
  - Name: Mode
    Type: PropertyType
    DataType: DynamicLinkMode
    ReferenceType: HasComponent
    ModellingRule: Optional
