- Name: raC_4_01_raC_Dvc_PM5000_PQEMDashboard_Model
  Type: ObjectLibraryItem
  Description: {"LocaleId":"","Text":"Name: PowerMonitor™ 5000 Power Quality & Energy Monitoring Advanced Multi-Device Dashboard - Model\n\nVersion: 4.01\n\nPurpose: Data Model, Databases, NetLogic, Resources, Device Organization, Configurations\n\nUsage:\nDrag-and-drop the raC_4_01_raC_Dvc_PM5000_PQEMDashboard_Model object in the Model folder in your project\n\nUpdating Project References - This library solution leverages multiple NuGet packages for enhanced functionality. After importing the library objects, you will receive NetLogic errors stating that the solution has failed to build. To resolve these errors, follow the steps below.\n \nPrerequisites:\n- Internet connection required for the first build (to download NuGet packages)\n- It requires raC_4_00_raC_Dvc_PM5000_PQEM_Model to be already imported in your project\n\nTo resolve these errors take the following steps:\n1. Navigate to the project file folder. You can do this easily by clicking the folder button in the toolbar., then again clicking the folder button to open the path in Windows.\n\n2. Open the NetSolution folder, then find the file with the extension .csproj. This filename will match the name of your project. Open it in a simple text editor like Notepad. In this file, paste the following code directly before the final line (</Project>).\n\n<ItemGroup>\n  <PackageReference Include=\"Newtonsoft.Json\" Version=\"13.0.3\" />\n  <PackageReference Include=\"FluentFTP\" Version=\"49.0.2\" />\n  <PackageReference Include=\"QuestPDF\" Version=\"2024.3.0\" />\n  <PackageReference Include=\"Meta.Numerics\" Version=\"4.1.4\" />\n</ItemGroup>\n\n3. Navigate to the Model node, then locate and expand raC_4_01_raC_Dvc_PM5000_PQEM_Model. Right-click on raC_4_01_raC_Dvc_PM5000_PQEM_Setup and select \"Execute SetupInitialConfiguration\" to automatically configure all required objects.\n\n4.Creating PowerMonitor Organization Tree: \n- Browse to: Project Files > res > raC_4_01_raC_Dvc_PM5000_PQEM_Dashboard_Model_Template.csv\n- Add each PM5000 device with its IP address, device name, and organizational hierarchy. \n- Follow the exact column format specified in the template. Save and Close the csv file.\n- Navigate to Model > raC_4_01_raC_Dvc_PM5000_PQEMDashboard_Model > raC_4_01_raC_Dvc_PM5000_PQEMDashboard_DevicesImporter\n- Right-click and select \"Execute Import\"\n- Reads the CSV file and automatically creates the organizational tree structure\n- After execution completes, go to: Model > raC_4_01_raC_Dvc_PM5000_PQEMDashboard_Model > PM5000_PQEM_OrgModel. Confirm all devices appear under the correct organizational hierarchy & Confirm each device instance is configured correctly and each parameter matches the CSV input"}
