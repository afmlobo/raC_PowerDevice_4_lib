- Name: raC_4_02_raC_Dvc_10xE_INT_InfLookup_Details
  Id: g=b78c174635174dc2c8a8950e92fab980
  Supertype: ValueMapConverter
  Description: {"LocaleId":"en-US","Text":"Information loop-up table for fault table containing long details/actions for fault codes"}
  ReferenceType: HasComponent
  Children:
  - Name: ns=2;Pairs
    Type: BaseObjectType
    ModellingRule: None
    Children:
    - Name: Pair1
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "No description found in the lookup table for the current code."
    - Name: Pair2
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 1
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Verify network cabling and connectors. \n2. Check EtherNet/IP connection configuration.\n3. Confirm scanner/controller is running."
    - Name: Pair3
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 2
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check and correct source of overload (load, mechanical transmission components, motor bearings).\n2. Set parameter values to match the motor and application requirements.\n3. Allow motor to cool before reset."
    - Name: Pair4
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 3
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check all three phases for presence and balance.2. Inspect upstream fuses, contactors, and terminals.3. Verify supply wiring integrity."
    - Name: Pair5
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 4
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Inspect equipment for mechanical obstruction.\n2. Check for seized bearings or blocked load."
    - Name: Pair6
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 5
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check for loose belts, couplings, or disconnected load.\n2. Inspect for broken or missing mechanical components."
    - Name: Pair7
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 6
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Validate intended test condition.\n2. Clear Test Trip after verification."
    - Name: Pair8
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 7
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check network configuration and node addressing.\n2. Inspect cabling and termination.\n3. Verify peer device is powered and operational."
    - Name: Pair9
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 8
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Power cycle the device.2. Check supply voltage quality.3. Check CSI cable connection.4. Replace device if fault recurs."
    - Name: Pair10
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 9
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Inspect breaker trip cause (overcurrent, short).\n2. Reset breaker after resolving fault."
    - Name: Pair11
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 10
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Inspect motor leads and insulation.\n2. Reset Circuit Breaker after fault is cleared."
    - Name: Pair12
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 11
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Inspect contactor contacts for welding.\n2. Replace contactor if necessary."
    - Name: Pair13
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 12
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Verify interlocks wiring and signals.\n2. Verify correct interlock configuration (NC or NO)"
    - Name: Pair14
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 21
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Monitor current trend.\n2. Reduce motor load to minimize risk of overload trip."
    - Name: Pair15
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 22
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Inspect supply for imbalance or intermittent loss.\n2. Check terminals and connection."
    - Name: Pair16
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 23
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Inspect system for mechanical obstruction.\n2. Address issue before trip occurs."
    - Name: Pair17
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 24
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Check for loss of load.\n2. Inspect couplings, belts, or material flow."
    - Name: Pair18
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 25
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Perform maintenance or operational check as indicated.\n2. Reset operations counter if applicable."
    - Name: Pair19
      Type: ValueMapPair
      ModellingRule: None
      Children:
      - Name: Key
        Type: BaseDataVariableType
        DataType: UInt32
        ModellingRule: None
        Value: 26
      - Name: Value
        Type: BaseDataVariableType
        DataType: String
        ModellingRule: None
        Value: "1. Perform scheduled preventive maintenance.\n2. Reset operating hours counter if applicable."
  - Name: Mode
    Type: PropertyType
    DataType: DynamicLinkMode
    ReferenceType: HasComponent
    ModellingRule: Optional
